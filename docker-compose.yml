name: sacco-platform

networks:
  sacco_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  esdata:
  admin_node_modules:

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    networks: [sacco_net]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sacco
      POSTGRES_PASSWORD: sacco
      POSTGRES_DB: sacco
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacco -d sacco"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16
    restart: unless-stopped
    networks: [sacco_net]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: sacco
      POSTGRES_PASSWORD: sacco
      POSTGRES_DB: sacco_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacco -d sacco_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    networks: [sacco_net]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    restart: unless-stopped
    networks: [sacco_net]
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.17.0
    restart: unless-stopped
    networks: [sacco_net]
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 15

  api:
    build: .
    restart: unless-stopped
    networks: [sacco_net]
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  admin:
    # Next.js 15 portal — dev-mode container. The host's admin/ tree is
    # volume-mounted so live reload works; node_modules stays inside the
    # container to avoid host/container architecture mismatches.
    image: node:22-slim
    restart: unless-stopped
    networks: [sacco_net]
    working_dir: /admin
    ports:
      - "3000:3000"  # Next.js dev server
      - "6006:6006"  # Storybook (sub-plan 04)
    volumes:
      - ./admin:/admin
      - admin_node_modules:/admin/node_modules
    environment:
      # Two API base URLs, because the portal calls the API from two places:
      #   - The BROWSER: client components mutate via TanStack Query through the
      #     typed api-client (baseUrl passed to AuthProvider). This must be a
      #     host-reachable origin allowed by the CSP connect-src —
      #     http://localhost:8000 (the api service publishes 8000 on the host).
      #   - The SERVER: route handlers + server components fetch the API from
      #     inside the container, where it's reachable as http://api:8000.
      # Server-side code reads API_INTERNAL_URL first; the browser bundle reads
      # NEXT_PUBLIC_API_BASE_URL. Using one var for both breaks one surface:
      # localhost:8000 → ECONNREFUSED server-side; api:8000 → CSP-blocked +
      # unresolvable in the browser.
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
      API_INTERNAL_URL: "http://api:8000"
      # Cookie secret picked up by Next.js middleware (sub-plan 07). Override
      # in a real .env if you want stable sessions across container restarts.
      COOKIE_SECRET: "dev-only-do-not-use-in-production"
      REFRESH_COOKIE_NAME: "sacco_refresh"
      
    command:
      - sh
      - -c
      - |
        corepack enable && \
        pnpm install --frozen-lockfile && \
        pnpm dev
    depends_on:
      api:
        condition: service_started
