[global]
repo1-type=s3
repo1-s3-endpoint=minio:9000
repo1-s3-uri-style=path
repo1-s3-bucket=sacco-backups
repo1-s3-region=us-east-1
# pgBackRest's S3 driver is TLS-only (no plain-HTTP mode). Locally MinIO
# serves a self-signed cert, so certificate verification is disabled. In
# production, drop this line and point repo1-storage-ca-file at the real CA.
repo1-storage-verify-tls=n
# Secrets are supplied via environment, NOT this file (pgBackRest does not
# expand ${VARS} in config). The env vars are:
#   PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET,
#   PGBACKREST_REPO1_CIPHER_PASS
# In production, inject these from the secrets manager.
repo1-path=/sacco
repo1-retention-full=6
repo1-retention-full-type=count
repo1-cipher-type=aes-256-cbc
start-fast=y
log-level-console=info
log-level-file=detail

[sacco]
pg1-path=/var/lib/postgresql/data
pg1-host-user=postgres
# The cluster's superuser is `sacco` (POSTGRES_USER), not the default
# `postgres` — pgBackRest must connect as it for stanza-create/backup.
pg1-user=sacco
pg1-database=sacco
