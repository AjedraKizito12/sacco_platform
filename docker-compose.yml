name: sacco-platform

networks:
  sacco_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  esdata:
  admin_node_modules:
  miniodata:
  minio_certs:

services:
  postgres:
    build:
      context: .
      dockerfile: infra/backups/Dockerfile.postgres
    restart: unless-stopped
    networks: [sacco_net]
    ports:
      - "5432:5432"
    command: >
      postgres
      -c archive_mode=on
      -c archive_command='pgbackrest --stanza=sacco --config=/etc/pgbackrest/pgbackrest.conf archive-push %p'
      -c max_wal_senders=3
      -c wal_level=replica
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/backups/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
    environment:
      POSTGRES_USER: sacco
      POSTGRES_PASSWORD: sacco
      POSTGRES_DB: sacco
      PGBACKREST_REPO1_S3_KEY: sacco-minio
      PGBACKREST_REPO1_S3_KEY_SECRET: sacco-minio-secret
      PGBACKREST_REPO1_CIPHER_PASS: local-dev-cipher-change-in-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacco -d sacco"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16
    restart: unless-stopped
    networks: [sacco_net]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: sacco
      POSTGRES_PASSWORD: sacco
      POSTGRES_DB: sacco_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sacco -d sacco_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    networks: [sacco_net]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.12-management
    restart: unless-stopped
    networks: [sacco_net]
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.17.0
    restart: unless-stopped
    networks: [sacco_net]
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 15

  # One-shot: generate a self-signed cert for MinIO TLS (pgBackRest's S3
  # driver is TLS-only). Cert is valid for the in-network name `minio` and
  # `localhost` (the container's own healthcheck). Idempotent — skips if the
  # cert already exists on the volume.
  minio-certs:
    image: alpine/openssl:latest
    networks: [sacco_net]
    volumes:
      - minio_certs:/certs
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /certs/public.crt ]; then
          openssl req -new -x509 -nodes -days 3650 \
            -subj "/CN=minio" \
            -addext "subjectAltName=DNS:minio,DNS:localhost,IP:127.0.0.1" \
            -keyout /certs/private.key -out /certs/public.crt
        fi
        echo minio-certs-done

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    networks: [sacco_net]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: sacco-minio
      MINIO_ROOT_PASSWORD: sacco-minio-secret
      # Override the image's built-in http `local` alias so the healthcheck
      # speaks TLS to the server.
      MC_HOST_local: "https://sacco-minio:sacco-minio-secret@localhost:9000"
    volumes:
      - miniodata:/data
      - minio_certs:/root/.minio/certs:ro
    depends_on:
      minio-certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mc", "--insecure", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-setup:
    image: minio/mc:latest
    networks: [sacco_net]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc --insecure alias set local https://minio:9000 sacco-minio sacco-minio-secret &&
      mc --insecure mb --ignore-existing local/sacco-backups &&
      mc --insecure version enable local/sacco-backups &&
      echo minio-setup-done
      "

  api:
    build: .
    restart: unless-stopped
    networks: [sacco_net]
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  admin:
    # Next.js 15 portal — dev-mode container. The host's admin/ tree is
    # volume-mounted so live reload works; node_modules stays inside the
    # container to avoid host/container architecture mismatches.
    image: node:22-slim
    restart: unless-stopped
    networks: [sacco_net]
    working_dir: /admin
    ports:
      - "3000:3000"  # Next.js dev server
      - "6006:6006"  # Storybook (sub-plan 04)
    volumes:
      - ./admin:/admin
      - admin_node_modules:/admin/node_modules
    environment:
      # Two API base URLs, because the portal calls the API from two places:
      #   - The BROWSER: client components mutate via TanStack Query through the
      #     typed api-client (baseUrl passed to AuthProvider). This must be a
      #     host-reachable origin allowed by the CSP connect-src —
      #     http://localhost:8000 (the api service publishes 8000 on the host).
      #   - The SERVER: route handlers + server components fetch the API from
      #     inside the container, where it's reachable as http://api:8000.
      # Server-side code reads API_INTERNAL_URL first; the browser bundle reads
      # NEXT_PUBLIC_API_BASE_URL. Using one var for both breaks one surface:
      # localhost:8000 → ECONNREFUSED server-side; api:8000 → CSP-blocked +
      # unresolvable in the browser.
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
      API_INTERNAL_URL: "http://api:8000"
      # Cookie secret picked up by Next.js middleware (sub-plan 07). Override
      # in a real .env if you want stable sessions across container restarts.
      COOKIE_SECRET: "dev-only-do-not-use-in-production"
      REFRESH_COOKIE_NAME: "sacco_refresh"
      
    command:
      - sh
      - -c
      - |
        corepack enable && \
        pnpm install --frozen-lockfile && \
        pnpm dev
    depends_on:
      api:
        condition: service_started
