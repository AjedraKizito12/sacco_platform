[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sacco-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "pydantic[email]==2.10.3",
    "pydantic-settings==2.7.0",
    "email-validator==2.3.0",
    "celery[redis]==5.4.0",
    "redis==5.2.1",
    "aio-pika==9.4.3",
    "elasticsearch==8.17.0",
    "aiohttp==3.11.10",  # async transport for elasticsearch-py
    "structlog==24.4.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[argon2,bcrypt]==1.7.4",
    "bcrypt>=3.1.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "anyio==4.7.0",
    "factory-boy==3.3.1",
    "httpx==0.27.2",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-passlib==1.7.7.20240819",
    "types-python-jose==3.3.4.20240106",
    "psycopg2-binary==2.9.10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# TCH (TC001/TC002/TC003) intentionally omitted: SQLAlchemy `Mapped[...]`,
# Pydantic v2, and FastAPI `Depends` all resolve annotations at runtime,
# so moving those imports into `if TYPE_CHECKING:` blocks breaks the app
# at import time. The repo's existing `# noqa: TC003` patterns predate
# this decision.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S"]
# B008 — `Query(...)` / `Depends(...)` defaults are FastAPI's idiomatic
# pattern and used pervasively across every router. Tolerating it
# repo-wide rather than peppering every endpoint with noqa.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Tests:
#   S101/S105/S106 — assert/hardcoded passwords are normal in tests.
#   E501 — long raw SQL strings / long table+schema interpolations.
#   E741 — single-letter names like `l` for "loan" / "line" in
#   list comprehensions.
"tests/**" = ["S101", "S105", "S106", "E501", "E741"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "aio_pika.*",
    "passlib.*",
    "jose.*",
    "celery.*",
    "elasticsearch.*",
    "weasyprint.*",
    "jinja2.*",
    "aiohttp.*",
]
ignore_missing_imports = true
